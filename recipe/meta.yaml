{% set name = "ellc" %}
{% set version = "1.8.12" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ellc-{{ version }}.tar.gz
  sha256: 49eee89586946d155a8f06a5b9818a06fb8488c2b1c7d40e0be0f56bef98d085

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('fortran') }}
  host:
    - numpy
    - pip
    - python
  run:
    - astropy >=1.1.1
    - numpy >=1.10.0
    - python
    - {{ pin_compatible('numpy') }}

test:
  imports:
    - ellc
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/pmaxted/ellc
  summary: Light curve model for eclipsing binary stars and transiting exoplanets
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - mwcraig
